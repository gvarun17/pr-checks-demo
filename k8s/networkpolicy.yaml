apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pr-checks-demo
  namespace: pr-checks-demo
spec:
  podSelector:
    matchLabels:
      app: pr-checks-demo
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    # DNS only; the demo service makes no other outbound calls
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
